[package]
name = "undertone-opl"
description = "OPL2 and OPL3 sequencing and channel allocation for Undertone, with lost-note accounting, a PC speaker engine and an oplon renderer"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
undertone-sound = { path = "../undertone-sound" }
undertone-mini = { path = "../undertone-mini" }
oplon = "=1.0.0"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
