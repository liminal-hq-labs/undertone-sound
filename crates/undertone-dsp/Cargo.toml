[package]
name = "fizz-audio-undertone"
version = "0.1.0"
description = "Undertone in Rust: a song's performance booked as the Web Audio graph the TypeScript engine makes, behind a small Graph trait, and an in-house renderer that plays it offline or as a stream"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
fizz-audio-song = { path = "../fizz-audio-song" }
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
