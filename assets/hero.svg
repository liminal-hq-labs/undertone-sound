<?xml version="1.0" encoding="UTF-8"?>
<!--
	Undertone Sound hero banner: equaliser bars rising and falling over a bench line, like a chip playing a tune.

	(c) Copyright 2026 Liminal HQ, Scott Morris
	SPDX-License-Identifier: Apache-2.0 OR MIT

	How to edit: scripts/init-project.sh fills in the title and description. Keep the title under
	about 16 characters and the description under about 60, or shrink their font-size. Keep the 1200 x 320 viewBox, SMIL only, the
	.motion and .static pairs for reduced motion, data-loop on the root and animations whose dur
	divides it. For a final wordmark, outline the title with Inkscape (export text to path) and
	keep the paths. Check every change with scripts/check-banner.sh and its shots option, and look
	at the frames (docs/new-project.md has the commands).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc" data-loop="9">
	<title id="hero-title">Undertone Sound</title>
	<desc id="hero-desc">Undertone Sound: Shared Rust sound core for Undertone. A Liminal HQ Labs experiment. An animated banner shows a row of equaliser bars rising and falling over a bench line, like a chip playing a tune.</desc>

	<style>
		.ui { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Adwaita Sans', Inter, sans-serif; }
		.mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
		.bg-a { stop-color: #080a12; }
		.bg-b { stop-color: #0b1220; }
		.edge { fill: none; stroke: #1e293b; }
		.static { display: none; }
		@media (prefers-color-scheme: dark) {
			.bg-a { stop-color: #05070d; }
			.bg-b { stop-color: #0a0f1c; }
			.edge { stroke: #162033; }
		}
		@media (prefers-reduced-motion: reduce) {
			.motion { display: none; }
			.static { display: inline; }
		}
	</style>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop class="bg-a" offset="0"/>
			<stop class="bg-b" offset="1"/>
		</linearGradient>
		<linearGradient id="afterglow" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#2dd4bf"/>
			<stop offset="0.5" stop-color="#818cf8"/>
			<stop offset="1" stop-color="#c084fc"/>
		</linearGradient>
		<radialGradient id="wash">
			<stop offset="0" stop-color="#818cf8" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
		</radialGradient>
		<filter id="haze" x="-60%" y="-60%" width="220%" height="220%">
			<feGaussianBlur stdDeviation="20"/>
		</filter>
		<clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
	</defs>

	<g clip-path="url(#frame)">
		<rect data-bg="" width="1200" height="320" fill="url(#bg)"/>
		<circle cx="70" cy="330" r="260" fill="url(#wash)"/>

		<!-- Left: title, description, status chip -->
		<!-- hero-text:start (system font; outline it for the final wordmark) -->
		<text class="ui" x="56" y="128" font-size="60" font-weight="800" letter-spacing="-1" fill="url(#afterglow)">Undertone Sound</text>
		<!-- hero-text:end -->
		<text class="ui" x="56" y="172" font-size="18" font-weight="500" fill="#e0e0e0">Shared Rust sound core for Undertone</text>
		<g class="ui" font-size="13" font-weight="600" fill="#b4bfce">
			<rect id="chip-status" data-box="" x="56" y="200" width="134" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.45"/>
			<circle class="motion" cx="74" cy="214" r="4" fill="#2dd4bf">
				<animate attributeName="opacity" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="1;0.35;1"/>
			</circle>
			<circle class="static" cx="74" cy="214" r="4" fill="#2dd4bf"/>
			<text data-for="chip-status" x="86" y="219">experimental</text>
		</g>
		<text class="mono" x="56" y="266" font-size="12" fill="#8a96aa">Liminal HQ Labs</text>

