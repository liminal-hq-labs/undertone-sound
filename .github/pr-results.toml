schema = 1
title = "Undertone Sound"

[[suite]]
name = "Rust tests"
check = "Undertone Sound Rust tests"
artifact = "rust-test-results"
files = ["**/junit.xml"]
flavour = "nextest"

[[suite]]
name = "CI steps"
check = "Undertone Sound CI steps"
artifact = "steps-test-results-*"
files = ["**/steps.xml"]
flavour = "steps"
required = true
