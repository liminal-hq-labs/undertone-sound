# One job per check, so a pull request's checks list names exactly what passed or failed.
# Rust jobs run in the shared ci-rust image (the site build in tauri-ci-desktop), pinned by digest (current pins:
# https://github.com/liminal-hq/.github/blob/main/docs/reference/recommended-image-pins.md).
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        id: check
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

      - name: Write the step report
        if: always()
        run: bash scripts/step-report.sh outcome results "Markdown lint" "Run markdownlint-cli2" "${{ steps.check.outcome }}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-markdown
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check SPDX headers
        run: bash scripts/step-report.sh run results "Licence headers" "Check SPDX headers" -- bash scripts/check-headers.sh

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-headers
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the event file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-file
          path: ${{ github.event_path }}
          if-no-files-found: ignore
          retention-days: 14

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: bash scripts/step-report.sh run results "Shell scripts" "Run shellcheck" -- shellcheck scripts/*.sh

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-shell
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run actionlint
        run: bash scripts/step-report.sh run results "Workflow lint" "Run actionlint" -- docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-workflows
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/step-report.sh run results "Hero banner" "Check the banner" -- bash scripts/check-banner.sh

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-banner
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  rust-format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check formatting
        id: check
        run: bash scripts/step-report.sh run results "Rust format" "Check formatting" -- cargo fmt --all -- --check

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Rust format"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo fmt --all -- --check\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-rust-format
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Run clippy
        id: check
        run: bash scripts/step-report.sh run results "Rust Clippy" "Run clippy" -- cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Rust Clippy"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo clippy --workspace --all-targets --locked -- -D warnings\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-rust-clippy
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Run the tests
        id: check
        run: bash scripts/step-report.sh run results "Rust tests" "Run the tests" -- cargo nextest run --profile ci --workspace --locked

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Rust tests"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo nextest run --profile ci --workspace --locked\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-rust-tests
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Rust test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  rust-doctests:
    name: Rust doc tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Run the doc tests
        id: check
        run: bash scripts/step-report.sh run results "Rust doc tests" "Run the doc tests" -- cargo test --workspace --doc --locked

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Rust doc tests"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo test --workspace --doc --locked\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-rust-doctests
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  rust-docs:
    name: Rust docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Build the docs
        id: check
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: bash scripts/step-report.sh run results "Rust docs" "Build the docs" -- cargo doc --workspace --no-deps --locked

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Rust docs"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo doc --workspace --no-deps --locked\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-rust-docs
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  oplstream-core:
    name: oplstream core features
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Test without default features
        id: check
        run: bash scripts/step-report.sh run results "oplstream core features" "Test without default features" -- cargo test -p oplstream --no-default-features --locked

      - name: Job summary
        if: always()
        run: |
          {
            echo "## oplstream core features"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo test -p oplstream --no-default-features --locked\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-oplstream-core
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  oplstream-alloc:
    name: oplstream alloc feature
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Test with the alloc feature only
        id: check
        run: bash scripts/step-report.sh run results "oplstream alloc feature" "Test with the alloc feature only" -- cargo test -p oplstream --no-default-features --features alloc --locked

      - name: Job summary
        if: always()
        run: |
          {
            echo "## oplstream alloc feature"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo test -p oplstream --no-default-features --features alloc --locked\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-oplstream-alloc
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  no-std-build:
    name: no_std build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Add the bare-metal target
        run: rustup target add thumbv7em-none-eabi

      - name: Build the oplstream core for a bare-metal target
        id: check
        run: bash scripts/step-report.sh run results "no_std build" "Build the oplstream core for a bare-metal target" -- cargo build -p oplstream --no-default-features --target thumbv7em-none-eabi --locked

      - name: Job summary
        if: always()
        run: |
          {
            echo "## no_std build"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo build -p oplstream --no-default-features --target thumbv7em-none-eabi --locked\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-no-std-build
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  wasm-build:
    name: WebAssembly build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound

      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the workspace for WebAssembly
        id: check
        run: bash scripts/step-report.sh run results "WebAssembly build" "Build the workspace for WebAssembly" -- cargo build --workspace --release --target wasm32-unknown-unknown --locked

      - name: Job summary
        if: always()
        run: |
          {
            echo "## WebAssembly build"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo build --workspace --release --target wasm32-unknown-unknown --locked\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-wasm-build
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  dependency-licences:
    name: Dependency licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check licences, bans and sources
        id: check
        run: bash scripts/step-report.sh run results "Dependency licences" "Check licences, bans and sources" -- cargo deny check licenses bans sources

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Dependency licences"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo deny check licenses bans sources\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-dependency-licences
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  advisories:
    name: Security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check advisories
        id: check
        run: bash scripts/step-report.sh run results "Security advisories" "Check advisories" -- cargo deny check advisories

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Security advisories"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`cargo deny check advisories\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-advisories
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  docs-site:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop@sha256:553180813ab6078f116ec456326629b29bf6af9eb167ce9bc6007fa64f3f8097
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound-site

      - name: Build the site
        id: check
        run: bash scripts/step-report.sh run results "Docs site" "Build the site" -- bash scripts/build-site.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Docs site"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`bash scripts/build-site.sh\` (VitePress build, then \`cargo doc\` into \`api/\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-docs-site
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14

  wasm-bindings:
    name: WebAssembly bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop@sha256:553180813ab6078f116ec456326629b29bf6af9eb167ce9bc6007fa64f3f8097
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: undertone-sound-wasm

      - name: Build the bindings
        id: check
        run: bash scripts/step-report.sh run results "WebAssembly bindings" "Build the bindings" -- bash scripts/build-wasm.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## WebAssembly bindings"
            echo "- Result: \`${{ steps.check.outcome }}\`"
            echo "- Command: \`bash scripts/build-wasm.sh\` (release build for \`wasm32-unknown-unknown\`, then \`wasm-bindgen --target web\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the step report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steps-test-results-wasm-bindings
          path: results/steps.xml
          if-no-files-found: ignore
          retention-days: 14
