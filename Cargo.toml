[package]
name = "fizz-audio-song"
version = "0.1.0"
description = "The song document for Fizz Audio Studio: types, validation, formatting, editor files, albums, the text readout and change summaries"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
# Mini-notation takes are checked and expanded through `fizz-audio-mini` (phase D1). Until that
# crate merges, the feature stays off and mini takes are neither checked nor expanded.
# TODO(D1): once `crates/fizz-audio-mini` exists, add it under [dependencies] as
#   fizz-audio-mini = { path = "../fizz-audio-mini", optional = true }
# make this `mini = ["dep:fizz-audio-mini"]`, and make `default = ["mini"]` (or drop the gate).
mini = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
ts-rs = { workspace = true, features = ["indexmap-impl"] }
chrono = { workspace = true }
